<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Items</title>
</head>
<body>
	<h1>All Items</h1>
	<table>
		<tbody>
			{% for item in items %}
				<tr>
					{% for field in item.fields %}
						<td>{{ item }}</td>
					{% endfor %}
				</tr>
			{% empty %}
				<tr>
					<td colspan="100%">No items found.</td>
				</tr>
			{% endfor %}
		</tbody>
	</table>
</body>
</html>
