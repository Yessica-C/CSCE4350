<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Items</title>
</head>
<body>
	<h1>All Items</h1>
    <a href="/inventory/"><button type="button">Inventory Home</button></a>
    <a href="/inventory/items/add/"><button type="button">Create New Item</button></a>

    <form method="get">
        <label for="item-search">Search by ID or name:</label>
        <input id="item-search" type="search" name="search" value="{{ search }}">
        <button type="submit">Search</button>
    </form>
    
	<table>
		<tbody>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Last Cost</th>
                <th>On Hand Quantity</th>
            </tr>
                {% for entry in table %}
                    <tr>
                        <td>{{ entry.item_id }}</td>
                        <td>{{ entry.item_name }}</td>
                        <td>{{ entry.item_description }}</td>
                        <td>{{ entry.item_price }}</td>
                        <td>{{ entry.item_last_cost }}</td>
                        <td>{{ entry.total_quantity }}</td>
                        <td><a href="/inventory/items/zoom/{{ entry.item_id }}">zoom</a></td>
                        <td><a href="/inventory/items/edit/{{ entry.item_id }}">edit</a></td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="100%">No items found.</td>
                    </tr>
                {% endfor %}
		</tbody>
	</table>
</body>
</html>
