<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Items</title>
</head>
<body>
	<h1>All Items</h1>
	<table>
		<tbody>
            <tr>
                <th>ID</th>
                <th>Name</th>
            </tr>
                {% for item in items %}
                    <tr>
                        <td>{{ item.id }}</td>
                        <td>{{ item.name }}</td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="100%">No items found.</td>
                    </tr>
                {% endfor %}
		</tbody>
	</table>
</body>
</html>
