<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Delete Purchase Order</title>
</head>
<body>
	<header>
		<h1>Delete Purchase Order</h1>
	</header>
	<p>Are you sure you want to delete purchase order #{{ po_object.po_num }}?</p>
	<form method="post">
		{% csrf_token %}
		<button type="submit">Yes, delete</button>
		<a href="{% url 'purchase_order_overview' %}">Cancel</a>
	</form>
</body>
</html>
